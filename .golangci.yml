version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace

issues:
  exclude-dirs:
    - bin
    - dist
  exclude-files:
    - ".*\\.pb\\.go$"
